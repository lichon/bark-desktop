name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build ${{ matrix.target }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          # Uncomment once the native backends land (see README, "Platform support").
          # The packaged build refuses to start without them, so shipping those
          # artifacts today would only produce broken downloads.
          # - os: macos-latest
          #   target: macos
          # - os: ubuntu-latest
          #   target: linux

    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build portable bundle
        run: python -m bark_pc.tools.build_portable --target ${{ matrix.target }}

      - name: List build output
        shell: bash
        run: ls -lh dist/

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: bark-desktop-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-tags: true

      - name: Verify the tag exists
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: test -n "$(git ls-remote --tags origin "refs/tags/$TAG")"

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*
