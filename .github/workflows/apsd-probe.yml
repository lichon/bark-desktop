name: Probe apsd

# Diagnostic, not a gate: can Apple's push daemon (apsd) be driven from a
# GitHub-hosted macOS runner, and does its signer produce a signature for an
# anonymous APNs activation? Prints the activation-info, the apsd signature and
# the certificate chain. Deliberately never calls albert.apple.com, so no
# certificate is issued. Every probe step is allowed to fail; only
# `workflow_dispatch` starts it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: apsd on macos-latest
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the probe script
        uses: actions/checkout@v4

      - name: Describe the runner
        run: |
          {
            echo "## runner"
            echo '```'
            uname -a
            sw_vers
            echo "hw.model: $(sysctl -n hw.model)"
            echo "kern.osversion: $(sysctl -n kern.osversion)"
            echo "kern.osproductversion: $(sysctl -n kern.osproductversion)"
            echo "running in a VM: $(sysctl -n kern.hv_vmm_present 2>/dev/null || echo '?')"
            echo "SIP: $(csrutil status 2>&1 | tr -d '\n')"
            ioreg -rd1 -c IOPlatformExpertDevice |
              grep -E '"(IOPlatformSerialNumber|IOPlatformUUID|model)"' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect apsd
        run: |
          FRAMEWORK=/System/Library/PrivateFrameworks/ApplePushService.framework
          BINARY="$FRAMEWORK/apsd"
          {
            echo '### apsd'
            echo '```'
            ls -ld "$FRAMEWORK" || echo "framework missing"
            file "$BINARY" 2>&1 || echo "no apsd binary (dyld shared cache?)"
            echo "codesign: $(codesign -dv "$BINARY" 2>&1 | head -6 | tr '\n' ' ')"
            echo "launchd: $(launchctl print system/com.apple.apsd 2>&1 |
              grep -E 'state =|path =|program =' | tr -s ' ' | tr '\n' ' ')"
            echo "running pid: $(pgrep -x apsd | tr '\n' ' ')"
            echo "objc class strings: $(strings -a "$BINARY" | grep -c APSCertificateProvisioner)"
            echo "objc selector strings: $(strings -a "$BINARY" | grep -c generateClientIdentity)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The agent talks to the Objective-C runtime, and Frida 17 no longer ships
      # the ObjC bridge, so frida-objc-bridge has to be bundled into it here.
      - name: Build the apsd agent
        id: agent
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent"
          cp .github/scripts/apsd-agent.js "$RUNNER_TEMP/agent/"
          cd "$RUNNER_TEMP/agent"
          printf '{"name":"apsd-agent","private":true,"type":"module"}\n' > package.json
          npm install --no-audit --no-fund --silent frida-compile frida-objc-bridge
          npx frida-compile apsd-agent.js -o "$RUNNER_TEMP/apsd-agent.js" -c
          ls -l "$RUNNER_TEMP/apsd-agent.js"

      - name: Set up the probe environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet \
            --disable-pip-version-check frida cryptography
          "$RUNNER_TEMP/venv/bin/python" -c \
            "import frida; print('frida', frida.__version__)"

      - name: Probe apsd signing
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "agent build: ${{ steps.agent.outcome }}"
          AGENT=()
          if [ -f "$RUNNER_TEMP/apsd-agent.js" ]; then
            AGENT=(--agent "$RUNNER_TEMP/apsd-agent.js")
          fi
          sudo -E "$RUNNER_TEMP/venv/bin/python" .github/scripts/probe_apsd.py \
            ${AGENT[@]+"${AGENT[@]}"} 2>&1 | tee "$RUNNER_TEMP/probe.txt"

      - name: Report
        if: always()
        env:
          OUTCOME: ${{ steps.probe.outcome }}
        run: |
          {
            echo "### identity probe: $OUTCOME"
            echo '```'
            cat "$RUNNER_TEMP/probe.txt" 2>/dev/null || echo "probe did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
